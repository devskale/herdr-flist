id = "herdr-flist"
name = "Filelist Row"
version = "0.1.1"
min_herdr_version = "0.7.0"
description = "A filelist row that follows the focused pane's cwd — locally or over SSH."
platforms = ["linux", "macos"]

[[panes]]
id = "row"
title = "Files"
placement = "split"
command = ["uv", "run", "filelist.py"]

[[actions]]
id = "open"
title = "Open filelist row"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "\"$HERDR_BIN_PATH\" plugin pane open --plugin herdr-flist --entrypoint row --placement split --direction right --no-focus"]
